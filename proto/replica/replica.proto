syntax = "proto3";

package replica;

option go_package = "go-mil/proto/replica";

service ReplicaService {
    rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse) {}
    rpc DeliverTransaction(DeliverTransactionRequest) returns (DeliverTransactionResponse) {}

    // User-facing transaction operations
    rpc Start(StartRequest) returns (StartResponse) {}
    rpc Read(ReadRequest) returns (ReadResponse) {}
    rpc Write(WriteRequest) returns (WriteResponse) {}
    rpc Commit(CommitRequest) returns (CommitResponse) {}
    rpc Abort(AbortRequest) returns (AbortResponse) {}
    
    // HLC operations
    rpc HlcGet(GetHLCTimeRequest) returns (HlcResponse) {}
    rpc HlcUpdate(HlcResponse) returns (HlcResponse) {}
    
    // Runtime information operations
    rpc GetRunTime(GetRunTimeRequest) returns (GetRunTimeResponse) {}
    rpc GetAllRunTime(GetAllRunTimeRequest) returns (GetAllRunTimeResponse) {}
}

message GetTransactionRequest {
    uint64 cts = 1;
}

message GetTransactionResponse {
    string tx_id = 1;
    uint64 cts = 2;
    bool found = 3;
    Transaction tx = 4;
}

message DeliverTransactionRequest {
    Transaction tx = 1;
}

message DeliverTransactionResponse {
    bool success = 1;
}

message Transaction {
    string tx_id = 1;
    uint64 sts = 2;
    uint64 cts = 3;
    Deps deps = 4;
    repeated Operation operations = 5;
}

message Deps {
    uint64 min_dep = 1;
    repeated uint64 dep_set = 2;
}

message Operation {
    enum Type {
        START = 0;
        READ = 1;
        WRITE = 2;
        PREPARE = 3;
        COMMIT = 4;
        ABORT = 5;
    }
    Type type = 1;
    string key = 2;
    int64 value = 3;
}

message StartRequest {
    // Optional: Isolation level, etc.
}

message StartResponse {
    string tx_id = 1;
    uint64 sts = 2;
}

message ReadRequest {
    string tx_id = 1;
    string key = 2;
}

message ReadResponse {
    int64 value = 1;
    bool found = 2;
}

message WriteRequest {
    string tx_id = 1;
    string key = 2;
    int64 value = 3;
}

message WriteResponse {
    bool success = 1;
}

message CommitRequest {
    string tx_id = 1;
}

message CommitResponse {
    bool success = 1;
    uint64 cts = 2;
}

message AbortRequest {
    string tx_id = 1;
}

message AbortResponse {
    bool success = 1;
}

message HlcResponse {
    uint64 ts = 1;
}

message GetHLCTimeRequest {}

message GetRunTimeRequest {
    string tx_id = 1;
}

message GetRunTimeResponse {
    bool found = 1;
    TxnRunTimeInfo runtime = 2;
}

message GetAllRunTimeRequest {}

message GetAllRunTimeResponse {
    repeated TxnRunTimeInfo runtimes = 1;
}

message TxnRunTimeInfo {
    string tx_id = 1;
    Transaction tx = 2;
    map<string, int64> buffer = 3;
    map<string, uint64> read_set = 4;
    uint64 dep = 5;
    bool active = 6;
}

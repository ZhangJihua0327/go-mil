syntax = "proto3";

package tso;

option go_package = "go-mil/proto/tso";

service TSO {
  rpc Tick (TickRequest) returns (TickResponse);
  rpc Tock (TockRequest) returns (TockResponse);
  rpc AcquireLock (AcquireLockRequest) returns (AcquireLockResponse);
  rpc ReleaseLock (ReleaseLockRequest) returns (ReleaseLockResponse);
  rpc ReleaseAllLocks (ReleaseAllLocksRequest) returns (ReleaseAllLocksResponse);
}

message TickRequest {}

message TickResponse {
  int64 timestamp = 1;
}

message TockRequest {}

message TockResponse {
  int64 timestamp = 1;
}

message ReleaseAllLocksRequest {
  string owner_id = 1;
}

message ReleaseAllLocksResponse {
  bool success = 1;
}

message AcquireLockRequest {
  string key = 1;
  string owner_id = 2; // format: {txid}_{replica_name}
  int64 ttl_ms = 3;
}

message AcquireLockResponse {
  bool success = 1;
}

message ReleaseLockRequest {
  string key = 1;
  string owner_id = 2;
}

message ReleaseLockResponse {
  bool success = 1;
}
